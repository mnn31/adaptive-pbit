[project]
name = "apbit"
version = "0.1.0"
description = "Correlation-aware sequential stopping for p-bit neural network inference"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
    "numpy>=1.26",
    "torch>=2.0",
    "torchvision>=0.15",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["fast: quick smoke/plumbing tests"]
